# Daty filtrow (4660/4662): dzien b0-4, miesiac b5-8, rok b9-15.
# Rok: baza 1999 - skalibrowane wg panelu (6.09.2027 zamiast 2028 przy bazie 2000).
text_sensor:
  - platform: template
    device_id: airpack4
    name: Data wymiany filtra nawiewnego
    icon: "mdi:calendar-clock"
    update_interval: 60s
    lambda: |-
      if (std::isnan(id(thessla_modbus_filtr_nawiew_data_raw).state)) return {};
      uint16_t v = (uint16_t) id(thessla_modbus_filtr_nawiew_data_raw).state;
      if (v == 0 || v == 0xFFFF) return {};
      int d = v & 0x1F, m = (v >> 5) & 0x0F;
      if (d < 1 || d > 31 || m < 1 || m > 12) return {};
      char buf[11];
      snprintf(buf, sizeof(buf), "%04d-%02d-%02d", 1999 + ((v >> 9) & 0x7F), m, d);
      return std::string(buf);
  - platform: template
    device_id: airpack4
    name: Data wymiany filtra wywiewnego
    icon: "mdi:calendar-clock"
    update_interval: 60s
    lambda: |-
      if (std::isnan(id(thessla_modbus_filtr_wywiew_data_raw).state)) return {};
      uint16_t v = (uint16_t) id(thessla_modbus_filtr_wywiew_data_raw).state;
      if (v == 0 || v == 0xFFFF) return {};
      int d = v & 0x1F, m = (v >> 5) & 0x0F;
      if (d < 1 || d > 31 || m < 1 || m > 12) return {};
      char buf[11];
      snprintf(buf, sizeof(buf), "%04d-%02d-%02d", 1999 + ((v >> 9) & 0x7F), m, d);
      return std::string(buf);

