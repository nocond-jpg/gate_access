# Thessla AirPack4 - Modbus RTU (adres 10, 9600 8N1) jako podurzadzenie ESPHome "Thessla AirPack4".
# Wymaga w pliku urzadzenia: modbus id "modbus1" (wspolna magistrala RS-485).
esphome:
  devices:
    - id: airpack4
      name: "Thessla AirPack4"

# Czas ostatniego poprawnego odczytu (millis) - podstawa "Komunikacja OK".
globals:
  - id: modbus_last_ok
    type: uint32_t
    restore_value: false
    initial_value: '0'

modbus_controller:
  - id: thessla_modbus
    address: 10
    modbus_id: modbus1
    update_interval: 30s
    setup_priority: -10

sensor:
  - platform: modbus_controller
    modbus_controller_id: thessla_modbus
    device_id: airpack4
    name: Temperatura czerpnia
    id: thessla_modbus_czerpnia_temp
    address: 16
    register_type: read
    accuracy_decimals: 1
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    filters: &tfilt
      - multiply: 0.1
      - lambda: |-
          if (x > 200.0f || x < -99.0f) return {};
          return x;
    on_raw_value:
      - lambda: 'id(modbus_last_ok) = millis();'
  - platform: modbus_controller
    modbus_controller_id: thessla_modbus
    device_id: airpack4
    name: Temperatura nawiew
    id: thessla_modbus_nawiew_temp
    address: 17
    register_type: read
    accuracy_decimals: 1
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    filters: *tfilt
  - platform: modbus_controller
    modbus_controller_id: thessla_modbus
    device_id: airpack4
    name: Temperatura wywiew
    id: thessla_modbus_wywiew_temp
    address: 18
    register_type: read
    accuracy_decimals: 1
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    filters: *tfilt
  - platform: modbus_controller
    modbus_controller_id: thessla_modbus
    device_id: airpack4
    name: Temperatura FPX
    id: thessla_modbus_fpx_temp
    address: 19
    register_type: read
    accuracy_decimals: 1
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    filters: *tfilt
  - platform: modbus_controller
    modbus_controller_id: thessla_modbus
    device_id: airpack4
    name: Temperatura PCB
    address: 22
    register_type: read
    accuracy_decimals: 1
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    entity_category: diagnostic
    icon: "mdi:cpu-64-bit"
    skip_updates: 4
    filters: *tfilt
  - platform: modbus_controller
    modbus_controller_id: thessla_modbus
    device_id: airpack4
    name: Strumień nawiew
    id: thessla_modbus_strumien_nawiew
    address: 256
    register_type: holding
    accuracy_decimals: 0
    value_type: U_WORD
    unit_of_measurement: "m³/h"
    state_class: measurement
    filters: &ffilt
      - lambda: |-
          if (x == 65535) return {};
          return x;
  - platform: modbus_controller
    modbus_controller_id: thessla_modbus
    device_id: airpack4
    name: Strumień wywiew
    id: thessla_modbus_strumien_wywiew
    address: 257
    register_type: holding
    accuracy_decimals: 0
    value_type: U_WORD
    unit_of_measurement: "m³/h"
    state_class: measurement
    filters: *ffilt
  - {platform: modbus_controller, modbus_controller_id: thessla_modbus, device_id: airpack4, name: "Stopień zużycia filtra nawiewnego", address: 4482, register_type: holding, value_type: U_WORD, unit_of_measurement: "%", state_class: measurement, icon: "mdi:air-filter", skip_updates: 120}
  - {platform: modbus_controller, modbus_controller_id: thessla_modbus, device_id: airpack4, name: "Stopień zużycia filtra wywiewnego", address: 4483, register_type: holding, value_type: U_WORD, unit_of_measurement: "%", state_class: measurement, icon: "mdi:air-filter", skip_updates: 120}
  - {platform: modbus_controller, modbus_controller_id: thessla_modbus, device_id: airpack4, name: "Data filtra nawiew (raw)", id: thessla_modbus_filtr_nawiew_data_raw, address: 4660, register_type: holding, value_type: U_WORD, accuracy_decimals: 0, skip_updates: 60, entity_category: diagnostic}
  - {platform: modbus_controller, modbus_controller_id: thessla_modbus, device_id: airpack4, name: "Data filtra wywiew (raw)", id: thessla_modbus_filtr_wywiew_data_raw, address: 4662, register_type: holding, value_type: U_WORD, accuracy_decimals: 0, skip_updates: 60, entity_category: diagnostic}
  - {platform: modbus_controller, modbus_controller_id: thessla_modbus, device_id: airpack4, name: "FPX flaga", address: 4192, register_type: holding, value_type: U_WORD, accuracy_decimals: 0, skip_updates: 2}
  - {platform: modbus_controller, modbus_controller_id: thessla_modbus, device_id: airpack4, name: "FPX tryb", address: 4198, register_type: holding, value_type: U_WORD, accuracy_decimals: 0, skip_updates: 2}
  - {platform: modbus_controller, modbus_controller_id: thessla_modbus, device_id: airpack4, name: "Aktualny status bypass", address: 4330, register_type: holding, value_type: U_WORD, accuracy_decimals: 0, skip_updates: 2}
  - {platform: modbus_controller, modbus_controller_id: thessla_modbus, device_id: airpack4, name: "Alarm", address: 8192, register_type: holding, value_type: U_WORD, accuracy_decimals: 0, skip_updates: 2}
  - {platform: modbus_controller, modbus_controller_id: thessla_modbus, device_id: airpack4, name: "Numer alarmu S zatrzymania", address: 4384, register_type: holding, value_type: U_WORD, accuracy_decimals: 0, skip_updates: 2}
  - {platform: modbus_controller, modbus_controller_id: thessla_modbus, device_id: airpack4, name: "Status ERV", address: 4704, register_type: holding, value_type: U_WORD, accuracy_decimals: 0, entity_category: diagnostic, icon: "mdi:radiator", skip_updates: 2}
  - {platform: modbus_controller, modbus_controller_id: thessla_modbus, id: sezon_raw, address: 4209, register_type: holding, value_type: U_WORD, internal: true}
  - {platform: modbus_controller, modbus_controller_id: thessla_modbus, device_id: airpack4, name: "CF zadana intensywność nawiewu", address: 272, register_type: read, value_type: U_WORD, unit_of_measurement: "%", entity_category: diagnostic, skip_updates: 2}
  - {platform: modbus_controller, modbus_controller_id: thessla_modbus, device_id: airpack4, name: "CF zadana intensywność wywiewu", address: 273, register_type: read, value_type: U_WORD, unit_of_measurement: "%", entity_category: diagnostic, skip_updates: 2}
  - {platform: modbus_controller, modbus_controller_id: thessla_modbus, device_id: airpack4, name: "CF zadany strumień nawiewu", id: thessla_cf_zadany_nawiew, address: 274, register_type: read, value_type: U_WORD, unit_of_measurement: "m³/h", entity_category: diagnostic, skip_updates: 2}
  - {platform: modbus_controller, modbus_controller_id: thessla_modbus, device_id: airpack4, name: "CF zadany strumień wywiewu", address: 275, register_type: read, value_type: U_WORD, unit_of_measurement: "m³/h", entity_category: diagnostic, skip_updates: 2}
  # Metryki liczone lokalnie (jak w ThesslaGreen_HA): sprawnosc temperaturowa i moc odzysku.
  # Moc odzysku [kW] = 0.000335 * V[m3/h] * (Tnawiew - Tczerpnia); V = strumien nawiewu (256),
  # a gdy CF nie podaje (65535) - zadany strumien CF (274).
  - platform: template
    device_id: airpack4
    name: Sprawność odzysku
    id: thessla_sprawnosc
    unit_of_measurement: "%"
    accuracy_decimals: 1
    state_class: measurement
    icon: "mdi:percent"
    update_interval: 60s
    lambda: |-
      float to = id(thessla_modbus_czerpnia_temp).state;
      float ts = id(thessla_modbus_nawiew_temp).state;
      float te = id(thessla_modbus_wywiew_temp).state;
      if (std::isnan(to) || std::isnan(ts) || std::isnan(te)) return NAN;
      if (std::fabs(te - to) < 0.5f) return NAN;
      return (ts - to) / (te - to) * 100.0f;
  - platform: template
    device_id: airpack4
    name: Moc odzysku
    id: thessla_moc_odzysku
    unit_of_measurement: "kW"
    device_class: power
    accuracy_decimals: 3
    state_class: measurement
    icon: "mdi:fire"
    update_interval: 60s
    lambda: |-
      float to = id(thessla_modbus_czerpnia_temp).state;
      float ts = id(thessla_modbus_nawiew_temp).state;
      float v = id(thessla_modbus_strumien_nawiew).state;
      if (std::isnan(v) || v <= 0.0f) {
        float vz = id(thessla_cf_zadany_nawiew).state;
        v = (std::isnan(vz) || vz <= 0.0f || vz >= 65535.0f) ? NAN : vz;
      }
      if (std::isnan(to) || std::isnan(ts) || std::isnan(v)) return NAN;
      return 0.000335f * v * (ts - to);

